name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies if present
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          else
            python -m pip install --upgrade pip
          fi

      - name: Lint with flake8 (if configured)
        run: |
          if command -v flake8 >/dev/null 2>&1; then
            echo "Running flake8..."
            flake8 || true
          else
            echo "flake8 not found; skipping lint"
          fi

      - name: Run tests (if any) — produce JUnit XML
        run: |
          if [ -f pytest.ini ] || [ -d tests ] || ls **/*_test.py 1> /dev/null 2>&1; then
            pytest -q --junitxml=pytest_results.xml
          else
            echo "No tests found, skipping pytest"
          fi

      - name: Safe demo generate (no Ollama)
        run: |
          python - <<'PY'
import json
from backend.game_generator import generate_game_html
spec = {
  'prompt': 'CI demo: small hole prototype',
  'title': 'CI Hole Demo',
  'genre': 'Arcade',
  'game_type': 'Hole',
  'mechanics': ['swallow','growth'],
  'entities': [{'name':'stone','role':'collectible','type':'object','behavior':'drift','color':'#ffd58a','shape':'circle'}],
  'assets': [{'name':'orb','type':'svg_hint','hint':'dark circle with rim'}],
  'player_color': '#000000',
  'enemy_color': '#ff6b00',
  'theme': 'CI generated hole',
  'instructions': 'Move the hole with the mouse.'
}
html = generate_game_html(spec)
print('HTML length:', len(html))
with open('generated_by_ci.html','w',encoding='utf-8') as f:
    f.write(html)
print('Wrote generated_by_ci.html')
PY

      - name: Upload generated artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-demo
          path: generated_by_ci.html

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest_results.xml
